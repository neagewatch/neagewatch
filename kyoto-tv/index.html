<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KYOTO TV</title>
<style>
:root{
 --bg:#08090b; --panel:rgba(17,19,24,.95); --panel2:#181b21; --text:#f7f7f8;
 --muted:#9da3ad; --line:#2a2e36; --accent:#e85a3d;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{min-height:100vh}
button,input{font:inherit}
.app{min-height:100vh;display:grid;grid-template-rows:auto 1fr}
.topbar{height:58px;display:flex;align-items:center;gap:14px;padding:0 18px;border-bottom:1px solid var(--line);background:#0c0e12}
.brand{font-weight:800;letter-spacing:.08em}
.brand small{font-weight:500;color:var(--muted);letter-spacing:0;margin-left:8px}
.spacer{flex:1}
.topbtn{border:1px solid var(--line);background:#14171c;color:var(--text);border-radius:9px;padding:7px 10px;cursor:pointer}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 360px;min-height:0}
.stage{position:relative;background:#000;min-height:calc(100vh - 58px);display:flex;align-items:center;justify-content:center;overflow:hidden}
.video-stack{position:absolute;inset:0}
.player{position:absolute;inset:0;width:100%;height:100%;border:0;opacity:0;pointer-events:none;background:#000}
.player.active{opacity:1;pointer-events:auto}
.boot{position:absolute;inset:0;display:grid;place-items:center;background:radial-gradient(circle at center,#242730 0,#08090b 65%);z-index:5}
.boot.hidden{display:none}
.bootbox{text-align:center;padding:28px}
.bootlogo{font-size:36px;font-weight:900;letter-spacing:.12em}
.boot p{color:var(--muted);margin:8px 0 18px}
.watch{border:0;background:var(--accent);color:white;border-radius:11px;padding:12px 18px;font-weight:700;cursor:pointer}
.chbug{position:absolute;left:18px;top:18px;z-index:3;background:rgba(0,0,0,.72);border:1px solid rgba(255,255,255,.15);border-radius:12px;padding:9px 12px;backdrop-filter:blur(10px)}
.chbug b{font-size:18px}.chbug span{color:#d0d3d8;font-size:12px;margin-left:8px}
.now{position:absolute;left:18px;bottom:18px;z-index:3;background:rgba(0,0,0,.72);border:1px solid rgba(255,255,255,.14);border-radius:12px;padding:11px 13px;max-width:min(620px,calc(100% - 36px));backdrop-filter:blur(10px)}
.now h2{margin:0 0 4px;font-size:17px}.now p{margin:0;color:#c9cdd3;font-size:13px}
.guide{background:var(--panel);border-left:1px solid var(--line);min-height:calc(100vh - 58px);display:flex;flex-direction:column}
.guideHead{padding:14px;border-bottom:1px solid var(--line)}
.guideTitle{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.guideTitle b{font-size:15px}
.hint{font-size:11px;color:var(--muted)}
.search{width:100%;border:1px solid var(--line);background:#0e1014;color:var(--text);padding:10px 11px;border-radius:9px;outline:none}
.channels{overflow:auto;padding:8px;display:grid;gap:5px}
.channel{width:100%;border:1px solid transparent;background:transparent;color:var(--text);border-radius:10px;padding:9px;display:grid;grid-template-columns:52px 88px 1fr 25px;gap:9px;align-items:center;text-align:left;cursor:pointer}
.channel:hover{background:#191c22}
.channel.active{background:#232730;border-color:var(--accent)}
.num{font-weight:800;font-variant-numeric:tabular-nums}
.thumb{width:88px;aspect-ratio:16/9;object-fit:cover;border-radius:7px;background:#222}
.ctitle{font-size:13px;font-weight:650;line-height:1.3}
.cmeta{display:block;color:var(--muted);font-size:11px;margin-top:3px}
.star{color:#f5c84b;font-size:16px}
.guideFoot{margin-top:auto;border-top:1px solid var(--line);padding:10px 14px;color:var(--muted);font-size:11px;line-height:1.6}
.guide.hidden{display:none}.layout.guideHidden{grid-template-columns:1fr}
.tuner{display:flex;gap:6px}
.tuner button{width:34px;height:32px;border:1px solid var(--line);background:#15181e;color:white;border-radius:8px;cursor:pointer}
@media(max-width:850px){
 .layout{grid-template-columns:1fr}
 .stage{min-height:58vw;aspect-ratio:16/9}
 .guide{min-height:auto;border-left:0;border-top:1px solid var(--line)}
 .channels{max-height:none}
 .topbar{padding:0 10px}.brand small{display:none}
}
@media(max-width:520px){
 .channel{grid-template-columns:42px 72px 1fr 20px}.thumb{width:72px}
 .topbar{height:54px}.topbtn.hide-sm{display:none}
}
</style>
</head>
<body>
<div class="app">
<header class="topbar">
  <div class="brand">KYOTO TV <small>京都を旅するテレビ</small></div>
  <div class="tuner">
    <button id="up" title="前のチャンネル">▲</button>
    <button id="down" title="次のチャンネル">▼</button>
  </div>
  <div class="spacer"></div>
  <button class="topbtn hide-sm" id="favoriteBtn">☆ お気に入り</button>
  <button class="topbtn" id="guideBtn">ガイドを隠す</button>
</header>
<div class="layout" id="layout">
  <main class="stage">
    <div class="video-stack" id="videoStack"></div>
    <div class="boot" id="boot"><div class="bootbox"><div class="bootlogo">KYOTO TV</div><p>京都の旅動画を、テレビのように。</p><button class="watch" id="startBtn">▶ 視聴を開始</button></div></div>
    <div class="chbug"><b id="bugNum">517</b><span id="bugName">清水寺</span></div>
    <div class="now"><h2 id="nowTitle">清水寺界隈を歩く</h2><p id="nowMeta">京都さんぽ ・ 清水寺 / 三年坂</p></div>
  </main>
  <aside class="guide" id="guide">
    <div class="guideHead"><div class="guideTitle"><b>京都チャンネル</b><span class="hint">▲▼ Tune ・ G Guide ・ F Favorite</span></div><input class="search" id="search" placeholder="場所・テーマを検索…"></div>
    <div class="channels" id="channels"></div>
    <div class="guideFoot">チャンネルを選ぶとその場で切り替わります。<br>キーボード：↑ ↓ チャンネル / G ガイド / F お気に入り</div>
  </aside>
</div>
</div>
<script>
const data=[
 {num:517,name:"清水寺",id:"54xjOKO-4z4",title:"清水寺界隈を歩く",meta:"京都さんぽ ・ 清水寺 / 三年坂",fav:true},
 {num:518,name:"祇園",id:"MXdMGi8DN3I",title:"夕暮れの祇園を歩く",meta:"夜の京都 ・ 祇園 / 八坂",fav:false},
 {num:519,name:"伏見稲荷",id:"sNwYJG0g_oI",title:"伏見稲荷大社 4K Walking Tour",meta:"王道名所 ・ 千本鳥居",fav:true},
 {num:520,name:"早朝伏見",id:"pggb97tSmWU",title:"早朝の伏見稲荷・千本鳥居",meta:"癒やし旅 ・ 早朝散歩",fav:false},
 {num:521,name:"嵐山",id:"1La4QzGeaaQ",title:"京都・嵐山を歩く",meta:"京都さんぽ ・ 竹林 / 渡月橋",fav:false},
 {num:522,name:"京都駅",id:"S_hR7s66ccI",title:"京都駅周辺ウォーク",meta:"街歩き ・ 京都駅",fav:false}
];
let current=0, started=false, favoritesOnly=false;
const stack=document.getElementById("videoStack"); const channels=document.getElementById("channels");
data.forEach((v,i)=>{const iframe=document.createElement("iframe");iframe.className="player"+(i===0?" active":"");iframe.dataset.src=`https://www.youtube.com/embed/${v.id}?rel=0&playsinline=1&enablejsapi=1`;iframe.src=i<3?iframe.dataset.src:"about:blank";iframe.allow="autoplay; encrypted-media; picture-in-picture";iframe.allowFullscreen=true;stack.appendChild(iframe);});
function render(){const q=document.getElementById("search").value.trim().toLowerCase();channels.innerHTML="";data.forEach((v,i)=>{if(favoritesOnly&&!v.fav)return;if(q&&!(v.name+v.title+v.meta).toLowerCase().includes(q))return;const b=document.createElement("button");b.className="channel"+(i===current?" active":"");b.innerHTML=`<span class="num">${v.num}</span><img class="thumb" src="https://i.ytimg.com/vi/${v.id}/mqdefault.jpg" alt=""><span><span class="ctitle">${v.name}</span><span class="cmeta">${v.title}</span></span><span class="star">${v.fav?"★":""}</span>`;b.addEventListener("click",()=>switchTo(i,true));channels.appendChild(b);});}
function ensureLoaded(i){[i,(i+1)%data.length,(i-1+data.length)%data.length].forEach(n=>{const f=document.querySelectorAll(".player")[n];if(f.src==="about:blank")f.src=f.dataset.src;});}
function switchTo(i,userAction=false){current=(i+data.length)%data.length;ensureLoaded(current);document.querySelectorAll(".player").forEach((p,n)=>p.classList.toggle("active",n===current));const v=data[current];document.getElementById("bugNum").textContent=v.num;document.getElementById("bugName").textContent=v.name;document.getElementById("nowTitle").textContent=v.title;document.getElementById("nowMeta").textContent=v.meta;if(started&&userAction){const f=document.querySelectorAll(".player")[current];if(!f.src.includes("autoplay=1")){f.src=f.dataset.src+"&autoplay=1";}}render();}
document.getElementById("startBtn").addEventListener("click",()=>{started=true;document.getElementById("boot").classList.add("hidden");const f=document.querySelectorAll(".player")[current];f.src=f.dataset.src+"&autoplay=1";ensureLoaded(current);});
document.getElementById("up").addEventListener("click",()=>switchTo(current-1,true));document.getElementById("down").addEventListener("click",()=>switchTo(current+1,true));document.getElementById("search").addEventListener("input",render);
function toggleGuide(){const guide=document.getElementById("guide"),layout=document.getElementById("layout");const hidden=guide.classList.toggle("hidden");layout.classList.toggle("guideHidden",hidden);document.getElementById("guideBtn").textContent=hidden?"ガイドを表示":"ガイドを隠す";}
document.getElementById("guideBtn").addEventListener("click",toggleGuide);document.getElementById("favoriteBtn").addEventListener("click",()=>{favoritesOnly=!favoritesOnly;document.getElementById("favoriteBtn").textContent=(favoritesOnly?"★ ":"☆ ")+"お気に入り";render();});
document.addEventListener("keydown",(e)=>{if(document.activeElement===document.getElementById("search"))return;if(e.key==="ArrowUp"){e.preventDefault();switchTo(current-1,true)}if(e.key==="ArrowDown"){e.preventDefault();switchTo(current+1,true)}if(e.key.toLowerCase()==="g")toggleGuide();if(e.key.toLowerCase()==="f")document.getElementById("favoriteBtn").click();});
render();ensureLoaded(0);
</script>
</body>
</html>
