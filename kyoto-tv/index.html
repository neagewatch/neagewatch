<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KYOTO TV</title><style>:root{--bg:#07080a;--panel:#111319;--panel2:#1b1e25;--text:#f6f7f8;--muted:#9ba1ab;--line:#2b3039;--accent:#e85a3d}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input{font:inherit}button{cursor:pointer}.top{height:58px;display:flex;align-items:center;gap:8px;padding:0 14px;background:#0c0e12;border-bottom:1px solid var(--line)}.brand{font-weight:900;letter-spacing:.08em;white-space:nowrap}.brand small{font-weight:500;letter-spacing:0;color:var(--muted);margin-left:8px}.spacer{flex:1}.btn{border:1px solid var(--line);background:#15181e;color:var(--text);border-radius:9px;padding:8px 10px}.btn.on{border-color:var(--accent);background:rgba(232,90,61,.14)}.layout{display:grid;grid-template-columns:minmax(0,1fr) 390px;min-height:calc(100vh - 58px)}.stage{position:relative;background:#000;overflow:hidden;min-height:calc(100vh - 58px)}.stack,.player{position:absolute;inset:0;width:100%;height:100%}.player{border:0;opacity:0;pointer-events:none;background:#000;transition:opacity .08s}.player.active{opacity:1;pointer-events:auto}.boot{position:absolute;inset:0;z-index:9;display:grid;place-items:center;background:radial-gradient(circle,#242833,#07080a 68%)}.boot.hidden{display:none}.bootbox{text-align:center}.bootlogo{font-size:38px;font-weight:900;letter-spacing:.12em}.boot p{color:var(--muted)}.watch{border:0;background:var(--accent);color:white;border-radius:11px;padding:13px 18px;font-weight:800}.bug,.now{position:absolute;z-index:4;background:rgba(0,0,0,.76);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(10px);border-radius:12px}.bug{top:16px;left:16px;padding:9px 12px}.bug b{font-size:19px}.bug span{font-size:12px;color:#d2d5da;margin-left:8px}.now{left:16px;bottom:16px;padding:11px 13px;max-width:calc(100% - 32px)}.now h2{margin:0 0 4px;font-size:17px}.now p{margin:0;color:#c8ccd2;font-size:12px}.zap{position:absolute;inset:0;z-index:8;display:grid;place-items:center;background:#000;opacity:0;pointer-events:none;transition:.1s}.zap.show{opacity:1}.zap b{font-size:48px}.guide{background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column}.head{padding:12px;border-bottom:1px solid var(--line)}.headrow{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}.headrow span{font-size:10px;color:var(--muted)}.search{width:100%;padding:9px 10px;border-radius:9px;border:1px solid var(--line);background:#0d0f13;color:var(--text)}.tabs{display:flex;gap:6px;overflow:auto;padding:8px;border-bottom:1px solid var(--line)}.tab{white-space:nowrap;border:1px solid var(--line);background:#15181e;color:#d9dde3;border-radius:999px;padding:7px 9px;font-size:12px}.tab.active{background:var(--accent);border-color:var(--accent);color:white}.channels{padding:7px;display:grid;gap:4px;overflow:auto;max-height:50vh}.ch{width:100%;border:1px solid transparent;background:transparent;color:var(--text);border-radius:10px;padding:8px;display:grid;grid-template-columns:46px 76px 1fr 28px;gap:8px;align-items:center;text-align:left}.ch:hover{background:#191c22}.ch.active{background:#232730;border-color:var(--accent)}.num{font-weight:850}.thumb{width:76px;aspect-ratio:16/9;object-fit:cover;border-radius:6px}.ct{font-size:13px;font-weight:700}.cm{display:block;color:var(--muted);font-size:10px;margin-top:3px}.fav{border:0;background:transparent;color:#f4c64e;font-size:18px}.bottom{border-top:1px solid var(--line);padding:10px 12px;display:grid;gap:10px}.pt{display:flex;justify-content:space-between;font-size:12px;font-weight:700}.pt span{color:var(--muted);font-size:10px;font-weight:500}.mini{display:grid;gap:5px;margin-top:5px}.mi{display:grid;grid-template-columns:42px 1fr;gap:6px;font-size:11px}.mn{color:var(--accent);font-weight:800}.mt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#d6dae0}.guide.hidden{display:none}.layout.full{grid-template-columns:1fr}.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);opacity:0;background:#20232b;border:1px solid var(--line);padding:9px 13px;border-radius:999px;z-index:40;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:900px){.layout{grid-template-columns:1fr}.stage{min-height:56.25vw;aspect-ratio:16/9}.guide{border-left:0;border-top:1px solid var(--line)}.brand small{display:none}.channels{max-height:none}}@media(max-width:600px){.top{padding:0 8px;gap:5px}.brand{font-size:14px}.btn{font-size:11px;padding:7px}.hide-sm{display:none}.ch{grid-template-columns:40px 66px 1fr 25px}.thumb{width:66px}}</style></head><body><header class="top"><div class="brand">KYOTO TV <small>京都を旅するテレビ</small></div><button class="btn" id="prev">▲</button><button class="btn" id="next">▼</button><div class="spacer"></div><button class="btn" id="random">🎲 おまかせ</button><button class="btn hide-sm" id="auto">▶ 自動次番組</button><button class="btn" id="guideBtn">ガイドを隠す</button></header><div class="layout" id="layout"><main class="stage"><div class="stack" id="stack"></div><div class="boot" id="boot"><div class="bootbox"><div class="bootlogo">KYOTO TV</div><p>京都の旅動画を、テレビのように。</p><button class="watch" id="start">▶ 視聴を開始</button></div></div><div class="zap" id="zap"><div style="text-align:center"><b id="zapNum">517</b><div id="zapName">清水寺</div></div></div><div class="bug"><b id="bugNum">517</b><span id="bugName">清水寺</span></div><div class="now"><h2 id="title"></h2><p id="meta"></p></div></main><aside class="guide" id="guide"><div class="head"><div class="headrow"><b>京都チャンネル</b><span>↑↓ Tune ・ G Guide ・ R Random</span></div><input id="search" class="search" placeholder="場所・テーマを検索…"></div><div id="tabs" class="tabs"></div><div id="channels" class="channels"></div><div class="bottom"><div><div class="pt">このあと <span>番組表</span></div><div id="upnext" class="mini"></div></div><div><div class="pt">最近見た <span>履歴</span></div><div id="history" class="mini"></div></div></div></aside></div><div id="toast" class="toast"></div><script>const data=[{num:517,name:'清水寺',id:'54xjOKO-4z4',title:'清水寺界隈を歩く',meta:'清水寺・三年坂',cat:'王道名所'},{num:518,name:'祇園',id:'MXdMGi8DN3I',title:'夕暮れの祇園を歩く',meta:'祇園・八坂',cat:'夜の京都'},{num:519,name:'伏見稲荷',id:'sNwYJG0g_oI',title:'伏見稲荷大社 4K Walking Tour',meta:'千本鳥居',cat:'王道名所'},{num:520,name:'早朝伏見',id:'pggb97tSmWU',title:'早朝の伏見稲荷・千本鳥居',meta:'早朝散歩',cat:'癒やし'},{num:521,name:'嵐山',id:'1La4QzGeaaQ',title:'京都・嵐山を歩く',meta:'竹林・渡月橋',cat:'自然・散策'},{num:522,name:'京都駅',id:'S_hR7s66ccI',title:'京都駅周辺ウォーク',meta:'京都駅',cat:'街歩き'}];let current=0,started=false,cat='すべて',auto=false;let favs=JSON.parse(localStorage.getItem('ktv-favs')||'[517,519]');let hist=JSON.parse(localStorage.getItem('ktv-hist')||'[]');const cats=['すべて','王道名所','街歩き','夜の京都','自然・散策','癒やし','★お気に入り'];const stack=document.getElementById('stack');data.forEach((v,i)=>{const f=document.createElement('iframe');f.className='player'+(i===0?' active':'');f.dataset.base=`https://www.youtube.com/embed/${v.id}?rel=0&playsinline=1`;f.src=i<3?f.dataset.base:'about:blank';f.allow='autoplay; encrypted-media; picture-in-picture';f.allowFullscreen=true;stack.appendChild(f)});function load(i){[i,(i+1)%data.length,(i-1+data.length)%data.length].forEach(n=>{const f=document.querySelectorAll('.player')[n];if(f.src==='about:blank')f.src=f.dataset.base})}function save(){localStorage.setItem('ktv-favs',JSON.stringify(favs));localStorage.setItem('ktv-hist',JSON.stringify(hist))}function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('show');clearTimeout(window.tt);window.tt=setTimeout(()=>e.classList.remove('show'),1100)}function renderTabs(){tabs.innerHTML='';cats.forEach(c=>{const b=document.createElement('button');b.className='tab'+(c===cat?' active':'');b.textContent=c;b.onclick=()=>{cat=c;renderTabs();renderChannels()};tabs.appendChild(b)})}function toggleFav(num){favs=favs.includes(num)?favs.filter(x=>x!==num):[...favs,num];save();renderChannels();toast(favs.includes(num)?'お気に入りに追加':'お気に入りから削除')}function renderChannels(){const q=search.value.toLowerCase().trim();channels.innerHTML='';data.forEach((v,i)=>{if(cat==='★お気に入り'&&!favs.includes(v.num))return;if(cat!=='すべて'&&cat!=='★お気に入り'&&v.cat!==cat)return;if(q&&!(v.name+v.title+v.meta+v.cat).toLowerCase().includes(q))return;const b=document.createElement('button');b.className='ch'+(i===current?' active':'');b.innerHTML=`<span class="num">${v.num}</span><img class="thumb" src="https://i.ytimg.com/vi/${v.id}/mqdefault.jpg"><span><span class="ct">${v.name}</span><span class="cm">${v.title}</span></span><button class="fav">${favs.includes(v.num)?'★':'☆'}</button>`;b.onclick=e=>{if(!e.target.classList.contains('fav'))switchTo(i,true)};b.querySelector('.fav').onclick=e=>{e.stopPropagation();toggleFav(v.num)};channels.appendChild(b)})}function renderSide(){upnext.innerHTML='';for(let k=1;k<=3;k++){const v=data[(current+k)%data.length];upnext.innerHTML+=`<div class="mi"><span class="mn">${v.num}</span><span class="mt">${v.name} — ${v.title}</span></div>`}history.innerHTML='';hist.slice(0,3).forEach(n=>{const v=data.find(x=>x.num===n);if(v)history.innerHTML+=`<div class="mi"><span class="mn">${v.num}</span><span class="mt">${v.name} — ${v.title}</span></div>`});if(!hist.length)history.innerHTML='<div style="font-size:11px;color:var(--muted)">まだ履歴はありません</div>'}function switchTo(i,user=false){current=(i+data.length)%data.length;const v=data[current];load(current);zapNum.textContent=v.num;zapName.textContent=v.name;zap.classList.add('show');setTimeout(()=>{document.querySelectorAll('.player').forEach((p,n)=>p.classList.toggle('active',n===current));zap.classList.remove('show')},100);bugNum.textContent=v.num;bugName.textContent=v.name;title.textContent=v.title;meta.textContent=v.meta+' ・ '+v.cat;if(user){hist=[v.num,...hist.filter(x=>x!==v.num)].slice(0,8);save()}if(started&&user){const f=document.querySelectorAll('.player')[current];if(!f.src.includes('autoplay=1'))f.src=f.dataset.base+'&autoplay=1'}renderChannels();renderSide()}function randomTune(){let i=current;while(i===current)i=Math.floor(Math.random()*data.length);switchTo(i,true);toast('おまかせ選局')}function toggleGuide(){const h=guide.classList.toggle('hidden');layout.classList.toggle('full',h);guideBtn.textContent=h?'ガイドを表示':'ガイドを隠す'}start.onclick=()=>{started=true;boot.classList.add('hidden');const f=document.querySelectorAll('.player')[current];f.src=f.dataset.base+'&autoplay=1';hist=[data[current].num,...hist.filter(x=>x!==data[current].num)].slice(0,8);save();renderSide()};prev.onclick=()=>switchTo(current-1,true);next.onclick=()=>switchTo(current+1,true);random.onclick=randomTune;guideBtn.onclick=toggleGuide;search.oninput=renderChannels;document.getElementById('auto').onclick=()=>{auto=!auto;document.getElementById('auto').classList.toggle('on',auto);toast(auto?'自動次番組 ON':'自動次番組 OFF')};setInterval(()=>{if(started&&auto)switchTo(current+1,true)},90000);document.addEventListener('keydown',e=>{if(document.activeElement===search)return;if(e.key==='ArrowUp'){e.preventDefault();switchTo(current-1,true)}if(e.key==='ArrowDown'){e.preventDefault();switchTo(current+1,true)}if(e.key.toLowerCase()==='g')toggleGuide();if(e.key.toLowerCase()==='r')randomTune()});renderTabs();switchTo(0,false);load(0);</script></body></html>
