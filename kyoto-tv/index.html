<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KYOTO TV</title><style>:root{--bg:#07080a;--panel:#111319;--text:#f6f7f8;--muted:#9ba1ab;--line:#2b3039;--accent:#e85a3d;--live:#ff3b30}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input{font:inherit}button{cursor:pointer}.top{min-height:58px;display:flex;align-items:center;gap:8px;padding:8px 14px;background:#0c0e12;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}.brand{font-weight:900;letter-spacing:.08em;white-space:nowrap}.brand small{font-weight:500;letter-spacing:0;color:var(--muted);margin-left:8px}.spacer{flex:1}.btn{border:1px solid var(--line);background:#15181e;color:var(--text);border-radius:9px;padding:8px 10px}.btn.on{border-color:var(--accent);background:rgba(232,90,61,.14)}.layout{display:grid;grid-template-columns:minmax(0,1fr) 420px;min-height:calc(100vh - 58px)}.stage{position:relative;background:#000;overflow:hidden;min-height:calc(100vh - 58px)}.stack,.playerWrap{position:absolute;inset:0;width:100%;height:100%}.playerWrap{opacity:0;pointer-events:none;transition:opacity .08s}.playerWrap.active{opacity:1;pointer-events:auto}.playerWrap>div,.playerWrap iframe{width:100%;height:100%}.boot{position:absolute;inset:0;z-index:9;display:grid;place-items:center;background:radial-gradient(circle,#242833,#07080a 68%)}.boot.hidden{display:none}.bootbox{text-align:center}.bootlogo{font-size:38px;font-weight:900;letter-spacing:.12em}.boot p{color:var(--muted)}.watch{border:0;background:var(--accent);color:white;border-radius:11px;padding:13px 18px;font-weight:800}.bug,.now{position:absolute;z-index:4;background:rgba(0,0,0,.76);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(10px);border-radius:12px}.bug{top:16px;left:16px;padding:9px 12px}.bug b{font-size:19px}.bug span{font-size:12px;color:#d2d5da;margin-left:8px}.liveMark{display:none;background:var(--live);color:white;font-size:10px;font-weight:800;padding:3px 6px;border-radius:999px;margin-left:7px}.liveMark.show{display:inline-block}.now{left:16px;bottom:16px;padding:11px 13px;max-width:calc(100% - 32px)}.now h2{margin:0 0 4px;font-size:17px}.now p{margin:0;color:#c8ccd2;font-size:12px}.zap{position:absolute;inset:0;z-index:8;display:grid;place-items:center;background:#000;opacity:0;pointer-events:none;transition:.1s}.zap.show{opacity:1}.zap b{font-size:48px}.guide{background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column}.head{padding:12px;border-bottom:1px solid var(--line)}.headrow{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}.headrow span{font-size:10px;color:var(--muted)}.search{width:100%;padding:9px 10px;border-radius:9px;border:1px solid var(--line);background:#0d0f13;color:var(--text)}.region,.tabs{display:flex;gap:6px;overflow:auto;padding:8px;border-bottom:1px solid var(--line)}.region{background:#0d0f13}.tab{white-space:nowrap;border:1px solid var(--line);background:#15181e;color:#d9dde3;border-radius:999px;padding:7px 9px;font-size:12px}.tab.active{background:var(--accent);border-color:var(--accent);color:white}.channels{padding:7px;display:grid;gap:4px;overflow:auto;max-height:48vh}.ch{width:100%;border:1px solid transparent;background:transparent;color:var(--text);border-radius:10px;padding:8px;display:grid;grid-template-columns:46px 76px 1fr 28px;gap:8px;align-items:center;text-align:left}.ch:hover{background:#191c22}.ch.active{background:#232730;border-color:var(--accent)}.num{font-weight:850}.thumbWrap{position:relative;width:76px}.thumb{width:76px;aspect-ratio:16/9;object-fit:cover;border-radius:6px;display:block}.liveBadge{position:absolute;left:4px;bottom:4px;background:var(--live);color:white;font-size:8px;font-weight:900;padding:2px 4px;border-radius:4px}.ct{font-size:13px;font-weight:700}.cm{display:block;color:var(--muted);font-size:10px;margin-top:3px}.fav{border:0;background:transparent;color:#f4c64e;font-size:18px}.bottom{border-top:1px solid var(--line);padding:10px 12px;display:grid;gap:11px}.pt{display:flex;justify-content:space-between;font-size:12px;font-weight:700}.pt span{color:var(--muted);font-size:10px;font-weight:500}.mini{display:grid;gap:5px;margin-top:5px}.mi{display:grid;grid-template-columns:60px 1fr;gap:6px;font-size:11px}.mn{color:var(--accent);font-weight:800}.mt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#d6dae0}.chapters{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.chapter{border:1px solid var(--line);background:#16191f;color:#e7e9ed;border-radius:8px;padding:6px 8px;font-size:11px}.guide.hidden{display:none}.layout.full{grid-template-columns:1fr}.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);opacity:0;background:#20232b;border:1px solid var(--line);padding:9px 13px;border-radius:999px;z-index:40;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:930px){.layout{grid-template-columns:1fr}.stage{min-height:56.25vw;aspect-ratio:16/9}.guide{border-left:0;border-top:1px solid var(--line)}.brand small{display:none}.channels{max-height:none}}@media(max-width:620px){.top{padding:7px 8px;gap:5px}.brand{font-size:14px}.btn{font-size:11px;padding:7px}.hide-sm{display:none}.ch{grid-template-columns:40px 66px 1fr 25px}.thumbWrap,.thumb{width:66px}}</style></head><body><header class="top"><div class="brand">KYOTO TV <small>京都を旅するテレビ</small></div><button class="btn" id="prev">▲</button><button class="btn" id="next">▼</button><div class="spacer"></div><button class="btn" id="liveOnly">🔴 LIVE</button><button class="btn" id="random">🎲 おまかせ</button><button class="btn hide-sm on" id="auto">⏭ 終了後つぎへ</button><button class="btn" id="guideBtn">ガイドを隠す</button></header><div class="layout" id="layout"><main class="stage"><div class="stack" id="stack"></div><div class="boot" id="boot"><div class="bootbox"><div class="bootlogo">KYOTO TV</div><p>観光動画とライブカメラを、テレビのように。</p><button class="watch" id="start">▶ 視聴を開始</button></div></div><div class="zap" id="zap"><div style="text-align:center"><b id="zapNum">517</b><div id="zapName">清水寺</div></div></div><div class="bug"><b id="bugNum">517</b><span id="bugName">清水寺</span><span id="liveMark" class="liveMark">LIVE</span></div><div class="now"><h2 id="title"></h2><p id="meta"></p></div></main><aside class="guide" id="guide"><div class="head"><div class="headrow"><b>京都チャンネル</b><span id="clock">--:--</span></div><input id="search" class="search" placeholder="場所・テーマを検索…"></div><div class="region" id="regions"></div><div id="tabs" class="tabs"></div><div id="channels" class="channels"></div><div class="bottom"><div><div class="pt">このあと <span>番組ガイド</span></div><div id="upnext" class="mini"></div></div><div><div class="pt">動画内スポット <span>対応動画のみ</span></div><div id="chapters" class="chapters"></div></div><div><div class="pt">最近見た <span>履歴</span></div><div id="history" class="mini"></div></div></div></aside></div><div id="toast" class="toast"></div><script src="https://www.youtube.com/iframe_api"></script><script>const data=[{num:517,name:'清水寺',id:'54xjOKO-4z4',title:'清水寺界隈を歩く',meta:'清水寺・三年坂',cat:'王道名所',area:'東山'},{num:518,name:'祇園',id:'MXdMGi8DN3I',title:'夕暮れの祇園を歩く',meta:'祇園・八坂',cat:'夜の京都',area:'東山'},{num:519,name:'伏見稲荷',id:'sNwYJG0g_oI',title:'伏見稲荷大社 4K Walking Tour',meta:'千本鳥居',cat:'王道名所',area:'伏見'},{num:520,name:'早朝伏見',id:'pggb97tSmWU',title:'早朝の伏見稲荷・千本鳥居',meta:'早朝散歩',cat:'癒やし',area:'伏見'},{num:521,name:'嵐山',id:'1La4QzGeaaQ',title:'京都・嵐山を歩く',meta:'竹林・渡月橋',cat:'自然・散策',area:'嵐山'},{num:522,name:'京都駅',id:'S_hR7s66ccI',title:'京都駅周辺ウォーク',meta:'京都駅',cat:'街歩き',area:'中心部'},{num:523,name:'祇園クイック',id:'hTzhPTQAbuw',title:'祇園 Walking Tour',meta:'祇園を短時間で散策',cat:'街歩き',area:'東山'},{num:524,name:'祇園→清水寺',id:'-IIcL5u00uM',title:'祇園・清水エリア王道ルート',meta:'円山公園・ねねの道・二年坂・三年坂・清水寺',cat:'王道名所',area:'東山'},{num:525,name:'哲学の道',id:'tEHxKJrH1fY',title:'哲学の道 Walking Tour',meta:'銀閣寺方面へ散策',cat:'自然・散策',area:'洛東'},{num:526,name:'哲学の道 新緑',id:'MSU8tn1H1d0',title:'新緑の哲学の道 4K',meta:'約1.5kmの散策ルート',cat:'季節',area:'洛東'},{num:527,name:'錦市場',id:'tU2R7JPdkCo',title:'錦市場 Walking Tour 4K',meta:'四条通から錦市場へ',cat:'グルメ',area:'中心部',chapters:[['イントロ',0],['地図',81],['四条通',98],['錦市場',420],['エンディング',1313]]},{num:601,name:'竹林の小径 LIVE',id:'Op-lf2NRMzs',title:'嵯峨嵐山 竹林の小径 ライブカメラ',meta:'京都市観光協会公式・リアルタイム',cat:'LIVE',area:'嵐山',live:true},{num:602,name:'花見小路 LIVE',id:'X5rq4ioggLk',title:'花見小路 ライブカメラ',meta:'京都市観光協会公式・リアルタイム',cat:'LIVE',area:'東山',live:true},{num:603,name:'伏見稲荷 LIVE',id:'Onyb8uHQV5Y',title:'伏見稲荷大社付近 裏参道ライブ',meta:'京都市観光協会公式・リアルタイム',cat:'LIVE',area:'伏見',live:true},{num:604,name:'哲学の道 LIVE',id:'S6IkZhhwG4A',title:'哲学の道 ライブカメラ',meta:'京都市観光協会公式・リアルタイム',cat:'LIVE',area:'洛東',live:true},{num:605,name:'大覚寺 LIVE',id:'ldO0Eqoomms',title:'大覚寺 ライブカメラ',meta:'京都市観光協会公式・リアルタイム',cat:'LIVE',area:'嵐山',live:true}];let current=0,started=false,cat='すべて',area='すべて',autoNext=true,apiReady=false;let favs=JSON.parse(localStorage.getItem('ktv-favs')||'[517,519,527,601]');let hist=JSON.parse(localStorage.getItem('ktv-hist')||'[]');const cats=['すべて','LIVE','王道名所','街歩き','夜の京都','自然・散策','季節','グルメ','癒やし','★お気に入り'];const areas=['すべて','東山','伏見','嵐山','中心部','洛東'];const players=[],wrappers=[];data.forEach((v,i)=>{const w=document.createElement('div');w.className='playerWrap'+(i===0?' active':'');const p=document.createElement('div');p.id='yt'+i;w.appendChild(p);stack.appendChild(w);wrappers.push(w)});window.onYouTubeIframeAPIReady=()=>{apiReady=true;data.forEach((v,i)=>{players[i]=new YT.Player('yt'+i,{videoId:v.id,playerVars:{playsinline:1,rel:0,modestbranding:1},events:{onStateChange:e=>{if(i===current&&e.data===YT.PlayerState.ENDED&&autoNext&&!data[i].live)switchTo(current+1,true,true)}}})})};function save(){localStorage.setItem('ktv-favs',JSON.stringify(favs));localStorage.setItem('ktv-hist',JSON.stringify(hist))}function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('show');clearTimeout(window.tt);window.tt=setTimeout(()=>e.classList.remove('show'),1100)}function makeTabs(box,list,type){box.innerHTML='';list.forEach(c=>{const b=document.createElement('button');b.className='tab'+((type==='cat'?cat:area)===c?' active':'');b.textContent=c;b.onclick=()=>{if(type==='cat')cat=c;else area=c;makeTabs(box,list,type);renderChannels()};box.appendChild(b)})}function toggleFav(num){favs=favs.includes(num)?favs.filter(x=>x!==num):[...favs,num];save();renderChannels();toast(favs.includes(num)?'お気に入りに追加':'お気に入りから削除')}function renderChannels(){const q=search.value.toLowerCase().trim();channels.innerHTML='';data.forEach((v,i)=>{if(cat==='★お気に入り'&&!favs.includes(v.num))return;if(cat!=='すべて'&&cat!=='★お気に入り'&&v.cat!==cat)return;if(area!=='すべて'&&v.area!==area)return;if(q&&!(v.name+v.title+v.meta+v.cat+v.area).toLowerCase().includes(q))return;const b=document.createElement('button');b.className='ch'+(i===current?' active':'');b.innerHTML=`<span class="num">${v.num}</span><span class="thumbWrap"><img class="thumb" src="https://i.ytimg.com/vi/${v.id}/mqdefault.jpg" alt="">${v.live?'<span class="liveBadge">LIVE</span>':''}</span><span><span class="ct">${v.name}</span><span class="cm">${v.area} ・ ${v.title}</span></span><button class="fav">${favs.includes(v.num)?'★':'☆'}</button>`;b.onclick=e=>{if(!e.target.classList.contains('fav'))switchTo(i,true,true)};b.querySelector('.fav').onclick=e=>{e.stopPropagation();toggleFav(v.num)};channels.appendChild(b)})}function hhmm(d){return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}function renderSide(){const base=new Date();base.setMinutes(Math.floor(base.getMinutes()/30)*30,0,0);upnext.innerHTML='';for(let k=0;k<4;k++){const v=data[(current+k)%data.length],s=new Date(base.getTime()+k*1800000),e=new Date(s.getTime()+1800000);upnext.innerHTML+=`<div class="mi"><span class="mn">${v.live?'LIVE':hhmm(s)}</span><span class="mt">${v.num} ${v.name} — ${v.title}</span></div>`}history.innerHTML='';hist.slice(0,3).forEach(n=>{const v=data.find(x=>x.num===n);if(v)history.innerHTML+=`<div class="mi"><span class="mn">${v.num}</span><span class="mt">${v.name}</span></div>`});if(!hist.length)history.innerHTML='<div style="font-size:11px;color:var(--muted)">まだ履歴はありません</div>';chapters.innerHTML='';const v=data[current];if(v.live)chapters.innerHTML='<span style="font-size:11px;color:var(--muted)">ライブ配信中：現在の京都をリアルタイム表示</span>';else if(v.chapters)v.chapters.forEach(([label,sec])=>{const b=document.createElement('button');b.className='chapter';b.textContent=label;b.onclick=()=>{if(players[current]?.seekTo){players[current].seekTo(sec,true);players[current].playVideo();toast(label+'へ移動')}};chapters.appendChild(b)});else chapters.innerHTML='<span style="font-size:11px;color:var(--muted)">この動画はスポットジャンプ未登録</span>'}function switchTo(i,user=false,play=false){current=(i+data.length)%data.length;const v=data[current];zapNum.textContent=v.num;zapName.textContent=v.name;zap.classList.add('show');setTimeout(()=>{wrappers.forEach((w,n)=>w.classList.toggle('active',n===current));zap.classList.remove('show')},100);bugNum.textContent=v.num;bugName.textContent=v.name;liveMark.classList.toggle('show',!!v.live);title.textContent=v.title;meta.textContent=v.area+' ・ '+v.meta+' ・ '+v.cat;if(user){hist=[v.num,...hist.filter(x=>x!==v.num)].slice(0,8);save()}if(started&&play&&apiReady&&players[current]?.playVideo){players.forEach((p,n)=>{if(n!==current&&p?.pauseVideo)try{p.pauseVideo()}catch(e){}});try{players[current].playVideo()}catch(e){}}renderChannels();renderSide()}function randomTune(){let pool=data.filter(v=>cat==='LIVE'?v.live:true);let pick=pool[Math.floor(Math.random()*pool.length)];switchTo(data.indexOf(pick),true,true);toast('おまかせ選局')}function toggleGuide(){const h=guide.classList.toggle('hidden');layout.classList.toggle('full',h);guideBtn.textContent=h?'ガイドを表示':'ガイドを隠す'}start.onclick=()=>{started=true;boot.classList.add('hidden');hist=[data[current].num,...hist.filter(x=>x!==data[current].num)].slice(0,8);save();if(apiReady&&players[current])players[current].playVideo();renderSide()};prev.onclick=()=>switchTo(current-1,true,true);next.onclick=()=>switchTo(current+1,true,true);random.onclick=randomTune;guideBtn.onclick=toggleGuide;search.oninput=renderChannels;auto.onclick=()=>{autoNext=!autoNext;auto.classList.toggle('on',autoNext);toast(autoNext?'終了後つぎへ ON':'終了後つぎへ OFF')};liveOnly.onclick=()=>{cat=cat==='LIVE'?'すべて':'LIVE';liveOnly.classList.toggle('on',cat==='LIVE');makeTabs(tabs,cats,'cat');renderChannels();toast(cat==='LIVE'?'LIVEチャンネルのみ':'全チャンネル')};setInterval(()=>clock.textContent=hhmm(new Date()),1000);document.addEventListener('keydown',e=>{if(document.activeElement===search)return;if(e.key==='ArrowUp'){e.preventDefault();switchTo(current-1,true,true)}if(e.key==='ArrowDown'){e.preventDefault();switchTo(current+1,true,true)}if(e.key.toLowerCase()==='g')toggleGuide();if(e.key.toLowerCase()==='r')randomTune()});makeTabs(regions,areas,'area');makeTabs(tabs,cats,'cat');switchTo(0,false,false);clock.textContent=hhmm(new Date());</script></body></html>
