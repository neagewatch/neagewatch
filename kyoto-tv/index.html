<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KYOTO TV</title><style>:root{--bg:#07080a;--panel:#111319;--text:#f6f7f8;--muted:#9ba1ab;--line:#2b3039;--accent:#e85a3d;--live:#ff3b30}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input{font:inherit}button{cursor:pointer}.top{min-height:58px;display:flex;align-items:center;gap:8px;padding:8px 14px;background:#0c0e12;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}.brand{font-weight:900;letter-spacing:.08em;white-space:nowrap}.brand small{font-weight:500;letter-spacing:0;color:var(--muted);margin-left:8px}.spacer{flex:1}.stat{font-size:11px;color:var(--muted);white-space:nowrap}.btn{border:1px solid var(--line);background:#15181e;color:var(--text);border-radius:9px;padding:8px 10px}.btn.on{border-color:var(--accent);background:rgba(232,90,61,.14)}.layout{display:grid;grid-template-columns:minmax(0,1fr) 420px;min-height:calc(100vh - 58px)}.stage{position:relative;background:#000;overflow:hidden;min-height:calc(100vh - 58px)}.stack,.slot{position:absolute;inset:0;width:100%;height:100%}.slot{opacity:0;pointer-events:none;transition:opacity .08s}.slot.active{opacity:1;pointer-events:auto}.slot>div,.slot iframe{width:100%;height:100%}.boot{position:absolute;inset:0;z-index:9;display:grid;place-items:center;background:radial-gradient(circle,#242833,#07080a 68%)}.boot.hidden{display:none}.bootbox{text-align:center}.bootlogo{font-size:38px;font-weight:900;letter-spacing:.12em}.boot p{color:var(--muted)}.watch{border:0;background:var(--accent);color:white;border-radius:11px;padding:13px 18px;font-weight:800}.bug,.now{position:absolute;z-index:4;background:rgba(0,0,0,.76);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(10px);border-radius:12px}.bug{top:16px;left:16px;padding:9px 12px}.bug b{font-size:19px}.bug span{font-size:12px;color:#d2d5da;margin-left:8px}.liveMark{display:none;background:var(--live);color:white!important;font-size:10px!important;font-weight:800;padding:3px 6px;border-radius:999px;margin-left:7px!important}.liveMark.show{display:inline-block}.now{left:16px;bottom:16px;padding:11px 13px;max-width:calc(100% - 32px)}.now h2{margin:0 0 4px;font-size:17px}.now p{margin:0;color:#c8ccd2;font-size:12px}.zap{position:absolute;inset:0;z-index:8;display:grid;place-items:center;background:#000;opacity:0;pointer-events:none;transition:.1s}.zap.show{opacity:1}.zap b{font-size:48px}.guide{background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column}.head{padding:12px;border-bottom:1px solid var(--line)}.headrow{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}.headrow span{font-size:10px;color:var(--muted)}.search{width:100%;padding:9px 10px;border-radius:9px;border:1px solid var(--line);background:#0d0f13;color:var(--text)}.region,.tabs{display:flex;gap:6px;overflow:auto;padding:8px;border-bottom:1px solid var(--line)}.region{background:#0d0f13}.tab{white-space:nowrap;border:1px solid var(--line);background:#15181e;color:#d9dde3;border-radius:999px;padding:7px 9px;font-size:12px}.tab.active{background:var(--accent);border-color:var(--accent);color:white}.channels{padding:7px;display:grid;gap:4px;overflow:auto;max-height:48vh}.ch{width:100%;border:1px solid transparent;background:transparent;color:var(--text);border-radius:10px;padding:8px;display:grid;grid-template-columns:46px 76px 1fr 28px;gap:8px;align-items:center;text-align:left}.ch:hover{background:#191c22}.ch.active{background:#232730;border-color:var(--accent)}.num{font-weight:850}.thumbWrap{position:relative;width:76px}.thumb{width:76px;aspect-ratio:16/9;object-fit:cover;border-radius:6px;display:block}.liveBadge{position:absolute;left:4px;bottom:4px;background:var(--live);color:white;font-size:8px;font-weight:900;padding:2px 4px;border-radius:4px}.ct{font-size:13px;font-weight:700}.cm{display:block;color:var(--muted);font-size:10px;margin-top:3px}.fav{border:0;background:transparent;color:#f4c64e;font-size:18px}.bottom{border-top:1px solid var(--line);padding:10px 12px;display:grid;gap:11px}.pt{display:flex;justify-content:space-between;font-size:12px;font-weight:700}.pt span{color:var(--muted);font-size:10px;font-weight:500}.mini{display:grid;gap:5px;margin-top:5px}.mi{display:grid;grid-template-columns:60px 1fr;gap:6px;font-size:11px}.mn{color:var(--accent);font-weight:800}.mt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#d6dae0}.chapters{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.chapter{border:1px solid var(--line);background:#16191f;color:#e7e9ed;border-radius:8px;padding:6px 8px;font-size:11px}.guide.hidden{display:none}.layout.full{grid-template-columns:1fr}.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);opacity:0;background:#20232b;border:1px solid var(--line);padding:9px 13px;border-radius:999px;z-index:40;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:930px){.layout{grid-template-columns:1fr}.stage{min-height:56.25vw;aspect-ratio:16/9}.guide{border-left:0;border-top:1px solid var(--line)}.brand small{display:none}.channels{max-height:none}}@media(max-width:700px){.stat{display:none}}@media(max-width:620px){.top{padding:7px 8px;gap:5px}.brand{font-size:14px}.btn{font-size:11px;padding:7px}.hide-sm{display:none}.ch{grid-template-columns:40px 66px 1fr 25px}.thumbWrap,.thumb{width:66px}}</style></head><body><header class="top"><div class="brand">KYOTO TV <small>京都を旅するテレビ</small></div><button class="btn" id="prev">▲</button><button class="btn" id="next">▼</button><div class="spacer"></div><span class="stat" id="channelStat"></span><button class="btn" id="liveOnly">🔴 LIVE</button><button class="btn" id="random">🎲 おまかせ</button><button class="btn hide-sm on" id="auto">⏭ 終了後つぎへ</button><button class="btn" id="guideBtn">ガイドを隠す</button></header><div class="layout" id="layout"><main class="stage"><div class="stack" id="stack"><div class="slot active"><div id="yt0"></div></div><div class="slot"><div id="yt1"></div></div><div class="slot"><div id="yt2"></div></div></div><div class="boot" id="boot"><div class="bootbox"><div class="bootlogo">KYOTO TV</div><p>観光動画とライブカメラを、テレビのように。</p><button class="watch" id="start">▶ 視聴を開始</button></div></div><div class="zap" id="zap"><div style="text-align:center"><b id="zapNum">517</b><div id="zapName">清水寺</div></div></div><div class="bug"><b id="bugNum">517</b><span id="bugName">清水寺</span><span id="liveMark" class="liveMark">LIVE</span></div><div class="now"><h2 id="title"></h2><p id="meta"></p></div></main><aside class="guide" id="guide"><div class="head"><div class="headrow"><b>京都チャンネル</b><span id="clock">--:--</span></div><input id="search" class="search" placeholder="場所・テーマを検索…"></div><div class="region" id="regions"></div><div id="tabs" class="tabs"></div><div id="channels" class="channels"></div><div class="bottom"><div><div class="pt">このあと <span>番組ガイド</span></div><div id="upnext" class="mini"></div></div><div><div class="pt">動画内スポット <span>対応動画のみ</span></div><div id="chapters" class="chapters"></div></div><div><div class="pt">最近見た <span>履歴</span></div><div id="history" class="mini"></div></div></div></aside></div><div id="toast" class="toast"></div><script src="channels.js"></script><script src="https://www.youtube.com/iframe_api"></script><script>const data=window.KYOTO_CHANNELS||[];let current=0,started=false,cat='すべて',area='すべて',autoNext=true,apiReady=false,activeSlot=0;let favs=JSON.parse(localStorage.getItem('ktv-favs')||'[517,519,527,601]');let hist=JSON.parse(localStorage.getItem('ktv-hist')||'[]');const $=id=>document.getElementById(id),els={prev:$('prev'),next:$('next'),random:$('random'),auto:$('auto'),guideBtn:$('guideBtn'),liveOnly:$('liveOnly'),layout:$('layout'),guide:$('guide'),search:$('search'),tabs:$('tabs'),regions:$('regions'),channels:$('channels'),upnext:$('upnext'),chapters:$('chapters'),history:$('history'),clock:$('clock'),boot:$('boot'),start:$('start'),zap:$('zap'),zapNum:$('zapNum'),zapName:$('zapName'),bugNum:$('bugNum'),bugName:$('bugName'),liveMark:$('liveMark'),title:$('title'),meta:$('meta'),channelStat:$('channelStat')};const slotEls=[...document.querySelectorAll('.slot')],players=[null,null,null],slotMap=[0,1,data.length-1];const cats=['すべて','LIVE','王道名所','街歩き','夜の京都','自然・散策','季節','グルメ','癒やし','★お気に入り'];const areas=['すべて',...new Set(data.map(v=>v.area))];els.channelStat.textContent=`${data.length} CH ・ LIVE ${data.filter(v=>v.live).length}`;window.onYouTubeIframeAPIReady=()=>{apiReady=true;for(let s=0;s<3;s++){players[s]=new YT.Player('yt'+s,{videoId:data[slotMap[s]].id,playerVars:{playsinline:1,rel:0,modestbranding:1},events:{onStateChange:e=>{if(s===activeSlot&&e.data===YT.PlayerState.ENDED&&autoNext&&!data[current].live)switchTo(current+1,true,true)}}})}};function save(){localStorage.setItem('ktv-favs',JSON.stringify(favs));localStorage.setItem('ktv-hist',JSON.stringify(hist))}function toast(t){const e=$('toast');e.textContent=t;e.classList.add('show');clearTimeout(window.tt);window.tt=setTimeout(()=>e.classList.remove('show'),1100)}function makeTabs(box,list,type){box.innerHTML='';list.forEach(c=>{const b=document.createElement('button');b.className='tab'+((type==='cat'?cat:area)===c?' active':'');b.textContent=c;b.onclick=()=>{if(type==='cat')cat=c;else area=c;makeTabs(box,list,type);renderChannels()};box.appendChild(b)})}function toggleFav(num){favs=favs.includes(num)?favs.filter(x=>x!==num):[...favs,num];save();renderChannels();toast(favs.includes(num)?'お気に入りに追加':'お気に入りから削除')}function renderChannels(){const q=els.search.value.toLowerCase().trim();els.channels.innerHTML='';data.forEach((v,i)=>{if(cat==='★お気に入り'&&!favs.includes(v.num))return;if(cat!=='すべて'&&cat!=='★お気に入り'&&v.cat!==cat)return;if(area!=='すべて'&&v.area!==area)return;if(q&&!(v.name+v.title+v.meta+v.cat+v.area).toLowerCase().includes(q))return;const b=document.createElement('button');b.className='ch'+(i===current?' active':'');b.innerHTML=`<span class="num">${v.num}</span><span class="thumbWrap"><img class="thumb" src="https://i.ytimg.com/vi/${v.id}/mqdefault.jpg" alt="">${v.live?'<span class="liveBadge">LIVE</span>':''}</span><span><span class="ct">${v.name}</span><span class="cm">${v.area} ・ ${v.title}</span></span><button class="fav">${favs.includes(v.num)?'★':'☆'}</button>`;b.onclick=e=>{if(!e.target.classList.contains('fav'))switchTo(i,true,true)};b.querySelector('.fav').onclick=e=>{e.stopPropagation();toggleFav(v.num)};els.channels.appendChild(b)})}function hhmm(d){return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}function renderSide(){const base=new Date();base.setMinutes(Math.floor(base.getMinutes()/30)*30,0,0);els.upnext.innerHTML='';for(let k=0;k<4;k++){const v=data[(current+k)%data.length],s=new Date(base.getTime()+k*1800000);els.upnext.innerHTML+=`<div class="mi"><span class="mn">${v.live?'LIVE':hhmm(s)}</span><span class="mt">${v.num} ${v.name} — ${v.title}</span></div>`}els.history.innerHTML='';hist.slice(0,3).forEach(n=>{const v=data.find(x=>x.num===n);if(v)els.history.innerHTML+=`<div class="mi"><span class="mn">${v.num}</span><span class="mt">${v.name}</span></div>`});if(!hist.length)els.history.innerHTML='<div style="font-size:11px;color:var(--muted)">まだ履歴はありません</div>';els.chapters.innerHTML='';const v=data[current];if(v.live)els.chapters.innerHTML='<span style="font-size:11px;color:var(--muted)">ライブ配信中：現在の京都をリアルタイム表示</span>';else if(v.chapters)v.chapters.forEach(([label,sec])=>{const b=document.createElement('button');b.className='chapter';b.textContent=label;b.onclick=()=>{const p=players[activeSlot];if(p?.seekTo){p.seekTo(sec,true);p.playVideo();toast(label+'へ移動')}};els.chapters.appendChild(b)});else els.chapters.innerHTML='<span style="font-size:11px;color:var(--muted)">この動画はスポットジャンプ未登録</span>'}function findSlot(idx){return slotMap.findIndex(x=>x===idx)}function repurposeSlot(slot,idx){slotMap[slot]=idx;if(apiReady&&players[slot]?.cueVideoById)players[slot].cueVideoById(data[idx].id)}function ensureThree(){const wanted=[current,(current+1)%data.length,(current-1+data.length)%data.length];wanted.forEach(idx=>{if(findSlot(idx)>=0)return;const slot=slotMap.findIndex((mapped,s)=>s!==activeSlot&&!wanted.includes(mapped));if(slot>=0)repurposeSlot(slot,idx)})}function switchTo(i,user=false,play=false){current=(i+data.length)%data.length;let target=findSlot(current);if(target<0){target=(activeSlot+1)%3;repurposeSlot(target,current)}const old=activeSlot,wasPlaying=started&&play;if(apiReady&&players[old]?.pauseVideo)try{players[old].pauseVideo()}catch(e){}activeSlot=target;const v=data[current];els.zapNum.textContent=v.num;els.zapName.textContent=v.name;els.zap.classList.add('show');setTimeout(()=>{slotEls.forEach((w,n)=>w.classList.toggle('active',n===activeSlot));els.zap.classList.remove('show');if(wasPlaying&&apiReady&&players[activeSlot]?.playVideo)try{players[activeSlot].playVideo()}catch(e){}ensureThree()},90);els.bugNum.textContent=v.num;els.bugName.textContent=v.name;els.liveMark.classList.toggle('show',!!v.live);els.title.textContent=v.title;els.meta.textContent=v.area+' ・ '+v.meta+' ・ '+v.cat;if(user){hist=[v.num,...hist.filter(x=>x!==v.num)].slice(0,8);save()}renderChannels();renderSide()}function randomTune(){let pool=data.filter(v=>cat==='LIVE'?v.live:true),pick=pool[Math.floor(Math.random()*pool.length)];switchTo(data.indexOf(pick),true,true);toast('おまかせ選局')}function toggleGuide(){const h=els.guide.classList.toggle('hidden');els.layout.classList.toggle('full',h);els.guideBtn.textContent=h?'ガイドを表示':'ガイドを隠す'}els.start.onclick=()=>{started=true;els.boot.classList.add('hidden');hist=[data[current].num,...hist.filter(x=>x!==data[current].num)].slice(0,8);save();if(apiReady&&players[activeSlot]?.playVideo)players[activeSlot].playVideo();renderSide()};els.prev.onclick=()=>switchTo(current-1,true,true);els.next.onclick=()=>switchTo(current+1,true,true);els.random.onclick=randomTune;els.guideBtn.onclick=toggleGuide;els.search.oninput=renderChannels;els.auto.onclick=()=>{autoNext=!autoNext;els.auto.classList.toggle('on',autoNext);toast(autoNext?'終了後つぎへ ON':'終了後つぎへ OFF')};els.liveOnly.onclick=()=>{cat=cat==='LIVE'?'すべて':'LIVE';els.liveOnly.classList.toggle('on',cat==='LIVE');makeTabs(els.tabs,cats,'cat');renderChannels();toast(cat==='LIVE'?'LIVEチャンネルのみ':'全チャンネル')};setInterval(()=>els.clock.textContent=hhmm(new Date()),1000);document.addEventListener('keydown',e=>{if(document.activeElement===els.search)return;if(e.key==='ArrowUp'){e.preventDefault();switchTo(current-1,true,true)}if(e.key==='ArrowDown'){e.preventDefault();switchTo(current+1,true,true)}if(e.key.toLowerCase()==='g')toggleGuide();if(e.key.toLowerCase()==='r')randomTune()});makeTabs(els.regions,areas,'area');makeTabs(els.tabs,cats,'cat');switchTo(0,false,false);els.clock.textContent=hhmm(new Date());</script></body></html>
